spring.application.name=hmp-admin-api

# Render (and most hosts) pass the port in $PORT
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# In-memory H2: every start begins from the Flyway schema + demo data
spring.datasource.url=jdbc:h2:mem:hmp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Only the health check is public
management.endpoints.web.exposure.include=health

# Invitation rules. Validity is still TBC in the spec (S12 > INVITATION)
hmp.invitation.validity=P14D
hmp.invitation.admin-actor=admin@hmp.co.kr
hmp.invitation.expiry-check-interval=PT1M
hmp.invitation.time-zone=Asia/Seoul
hmp.demo-data.enabled=true

# Comma-separated list, e.g. http://localhost:3000,https://hmp-admin-web.vercel.app
hmp.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
